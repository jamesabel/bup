[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bup"
dynamic = ["version"]
description = "backup all your AWS S3 buckets and DynamoDB tables, and github repos to a backup directory/folder"
readme = "README.md"
license = "GPL-3.0-only"
requires-python = ">=3.13"
authors = [
    {name = "abel", email = "j@abel.co"},
]
keywords = ["aws", "dynamodb", "s3", "github", "backup"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
]
dependencies = [
    "ismain",
    "balsa",
    "boto3",
    "typeguard",
    # S3Access.sync_to_directory() and verify_directory(), which do the S3 backup and its verification (9.3.0), with an HTTP
    # connection pool that fits the requests they make at the same time (9.3.1)
    "awsimple>=9.4.0",
    "GitPython",
    "github3.py",
    "sqlitedict",
    "tobool",
    "attrs",
    "appdirs",
    "psutil",  # tells if the process that was running a backup still is (bup/backup_history.py)
    "pref",
    "pyqt5",
    "python-dotenv",
    "sentry-sdk",
]

# Development tools, installed by "uv sync" (tools\make_venv.bat) but not part of the published package.
[dependency-groups]
dev = [
    "pytest",
    "moto[server]",
    "coverage",
    "pytest-cov",
    "pyship",
    "ruff",
    "ty",
    "PyQt5-stubs",
]

[project.urls]
Homepage = "https://github.com/jamesabel/bup"
Download = "https://github.com/jamesabel/bup"

[project.scripts]
bup = "bup.__main__:main"

[tool.setuptools.dynamic]
version = {attr = "bup.__version__.__version__"}

[tool.setuptools.packages.find]
include = ["bup*"]

[tool.setuptools.package-data]
bup = ["bup.png", "bup.ico", "LICENSE", "gpl-3.0.md"]

[tool.pyship]
ui = "gui"
upload = true
# The pyship-abel-bup bucket is private now; installed copies self-update through the
# gated feed on www.abel.co (see pyship launcher update_url).
public_readable = false
update_url = "https://www.abel.co/updates/bup"

# Sign the launcher and installer with the Sectigo code-signing certificate on the hardware token (Windows
# certificate store, selected by thumbprint). The token PIN comes from the PYSHIP_SIGNING_CERTIFICATE_PIN
# environment variable; a signing failure aborts the ship so an unsigned release can't go out by accident.
code_sign = true
certificate_sha1 = "6AE7810A68EABB5C80E7DD85BAE500AA4EDA5DE1"

# registry settings pyship is using has been flagging a false positve on Windows defender so don't use run_on_startup for now
run_on_startup = false

[tool.uv]
# Windows must be installable from wheels: the newest pyqt5-qt5 releases have no Windows wheel, and without this uv
# resolves to one of them (pip picks the last release that has one, 5.15.2).
required-environments = ["sys_platform == 'win32' and platform_machine == 'AMD64'"]

[tool.ruff]
line-length = 192

[tool.ruff.lint]
# pycodestyle errors and warnings and pyflakes, as flake8 checked
select = ["E", "F", "W"]
# E402 module level import not at top of file
# E501 line too long
# F401 imported but unused
ignore = ["E402", "E501", "F401"]

[tool.ty.src]
# the package only: the tests replace attributes with stand-ins all over, which a type checker rejects
include = ["bup"]

[tool.pytest.ini_options]
norecursedirs = "app build dist .git .pytest_cache .venv"
